spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Routes - Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Routes - Product Service
spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=lb://product-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**,/api/categories/**

# Routes - Sales Service
spring.cloud.gateway.routes[2].id=sales-service
spring.cloud.gateway.routes[2].uri=lb://sales-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/customers/**,/api/sales-orders/**,/api/deliveries/**

# Routes - Purchase Service
spring.cloud.gateway.routes[3].id=purchase-service
spring.cloud.gateway.routes[3].uri=lb://purchase-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/vendors/**,/api/purchase-orders/**

# Routes - BOM Service
spring.cloud.gateway.routes[4].id=bom-service
spring.cloud.gateway.routes[4].uri=lb://bom-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/boms/**,/api/work-centers/**

# Routes - Manufacturing Service
spring.cloud.gateway.routes[5].id=manufacturing-service
spring.cloud.gateway.routes[5].uri=lb://manufacturing-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/manufacturing-orders/**,/api/work-orders/**

# Routes - Inventory Service
spring.cloud.gateway.routes[6].id=inventory-service
spring.cloud.gateway.routes[6].uri=lb://inventory-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/stocks/**,/api/stock-ledger/**

# Routes - Procurement Service
spring.cloud.gateway.routes[7].id=procurement-service
spring.cloud.gateway.routes[7].uri=lb://procurement-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/procurement/**

# Routes - Audit Service
spring.cloud.gateway.routes[8].id=audit-service
spring.cloud.gateway.routes[8].uri=lb://audit-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/audit/**,/api/dashboard/**

# JWT Secret (must match auth-service)
jwt.secret=erp-super-secret-key-for-jwt-token-signing-2024

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.erp.gateway=DEBUG